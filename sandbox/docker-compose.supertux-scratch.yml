    volumes:
      - ../out/exported/stx-scratch-deepseek:/export
    command:
      - bash
      - -lc
      - |
        set -e
        mkdir -p results/speedrun/best "$$TMPDIR" "$$XDG_DATA_HOME"
        find results/speedrun -type f -delete
        
        exec sleep infinity
    environment:
      HTTP_PROXY: "http://proxy:8888"
      HTTPS_PROXY: "http://proxy:8888"
      http_proxy: "http://proxy:8888"
      https_proxy: "http://proxy:8888"
      GAME: "supertux"
      BEST_PREFIX: "supertux"
      STX_MAX_STEPS: "15000"
      PLAN: "1"
      REPLAN_EVERY: "5"
      ORACLE_FEEDBACK: "1"
      MEASURE_BEST: "0"
