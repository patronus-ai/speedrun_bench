  # ---------------- claude-opus-5 ----------------
  # Wiring mirrored VERBATIM from docker-compose.nesmario-arms.yml, including the oddity that
  # SWEEP_* point at Baseten while OPENROUTER_API_KEY is supplied by name — the opus agent card's
  # provider block reads {env:OPENROUTER_API_KEY} directly, and omitting it is what produced
  # "No cookie auth credentials found" on other arms. Do not "tidy" this without re-testing.
  eval-service-tuxemon-opus:
