User tinyproxy
Group tinyproxy
Port 8888
Listen 0.0.0.0
Timeout 600

# Accept connections from the internal agent network.
Allow 0.0.0.0/0

# Host allowlist: deny everything, permit only what matches sandbox/filter.
FilterDefaultDeny Yes
Filter "/etc/tinyproxy/filter"
FilterExtended On
FilterCaseSensitive Off

# Allow HTTPS CONNECT only to standard TLS ports (the vLLM endpoint is :443).
ConnectPort 443
ConnectPort 8443

LogLevel Info
